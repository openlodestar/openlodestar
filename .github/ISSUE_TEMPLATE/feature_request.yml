name: Feature request
description: 提一个具体的能力或改进建议
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        大改动（改判据、改提示词、改底稿格式）建议先在这里对齐，再开 PR。
  - type: textarea
    id: problem
    attributes:
      label: 要解决什么问题
      description: 现在卡在哪里，影响谁，有没有具体例子
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议怎么做
      description: 说清输入、输出和判断标准；能给出验收方式最好
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过但没选的方案
      description: 为什么不用它们（可选）
  - type: dropdown
    id: scope
    attributes:
      label: 涉及哪一层
      options:
        - 引擎 / 判据
        - 检索 / 搜索提供者
        - 抓取 / 浏览器插件
        - 底稿 / 坐标
        - 文档 / 使用体验
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 这不是安全漏洞（安全问题走 SECURITY.md 的私密渠道）
          required: true
