name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck · test · offline demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Site check
        run: node scripts/check-site.mjs

      - name: Offline demo
        run: pnpm run demo

      - name: Quote hard guard
        run: pnpm exec tsx src/cli.ts verify-quotes --data .openlodestar-demo

      - name: Ledger audit
        run: pnpm exec tsx src/cli.ts audit --data .openlodestar-demo

      - name: Real-case offline demo
        run: pnpm run demo:real

      - name: Quote hard guard (real case)
        run: pnpm exec tsx src/cli.ts verify-quotes --data .openlodestar-demo/poly-2021-autumn

      - name: Ledger audit (real case)
        run: pnpm exec tsx src/cli.ts audit --data .openlodestar-demo/poly-2021-autumn
