name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: typecheck · test · offline demos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Site check
        run: node scripts/check-site.mjs

      # 生成物必须与当前代码一致：改了领域规则或冻结批次却忘记重跑，页面上会留着旧答案。
      # 三个构建脚本不写墙钟时间，所以同一份输入重跑的结果应当字字相同，有差异就是真的漂了。
      - name: Generated demo data is fresh
        run: |
          pnpm run demo:data
          pnpm run demo:game
          pnpm run demo:sort
          git diff --exit-code -- docs/assets

      - name: Offline demo
        run: pnpm run demo

      - name: Quote hard guard
        run: pnpm exec tsx src/cli.ts verify-quotes --data .openlodestar-demo

      - name: Ledger audit
        run: pnpm exec tsx src/cli.ts audit --data .openlodestar-demo

      - name: Real-case offline demo
        run: pnpm run demo:real

      - name: Quote hard guard (real case)
        run: pnpm exec tsx src/cli.ts verify-quotes --data .openlodestar-demo/poly-2021-autumn

      - name: Ledger audit (real case)
        run: pnpm exec tsx src/cli.ts audit --data .openlodestar-demo/poly-2021-autumn
