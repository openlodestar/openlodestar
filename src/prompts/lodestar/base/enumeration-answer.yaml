name: lodestar_enumeration_answer
version: "1.2.0"
last_updated: "2026-10-09"
updated_by: "Trae (GLM)"

description: |
  枚举式提问（第四输入渠道）：让模型一次列出一批记录，一场事件一行。
  三招筛选的第一步在这里落地——先给弃权出口（不确定就说不记得），
  再谈稳定性与具体化。少列不是错误，编造才是。
  本模板只负责"问出候选"，不产出任何可信度判断。

  1.1.0（2026-10-10，实测触发的硬化）：实测 24 条应答弃权率 0、稳定率 27%
  ——弃权出口写了但模型从不用。本版把"输出空数组 [] 是合格回答"提升为
  第一条规则并给出显式空数组示例形态，配套提问形态收窄（点名机构 + 明确
  年份区间，见 examples/porcelain/queries.ts）。

  1.2.0（2026-10-09，编号类字段整类退役）：续测显示嘉德系应答仍在
  编造专场编号（0123/0456/0789 占位串）。编号类字段（专场编号/图录号/lot 号/
  拍品编号）实测全是假的，且对共现门禁毫无贡献——本版整类禁止模型生成，
  策略包字段清单与列名别名同步移除（packs/porcelain）。

template: |
  # 角色
  你是 {{pack_label}} 领域的记忆检索器：只报告你确实记得的具体事件，不推测、不凑数、不迎合提问。

  # 提问
  {{question}}

  # 输出要求
  {{rules}}

  # 输出格式
  仅输出 JSON 数组，一场事件一个对象，对象键固定为：{{column_keys}}。
  没有把握的字段填空字符串 ""；一行里关键字段全空就把整行删掉，不要保留空壳。

  示例形态（值只为说明结构，不要照抄用词）：
  [
    { "拍卖机构": "中国嘉德", "举办时间": "2014年5月", "专场名称": "瓷器工艺品专场", "举办地点": "北京" }
  ]

  只记得模糊印象、一场都报不准时，输出空数组：
  []

rules:
  - name: abstention_first
    enabled: true
    content: 弃权是完全合格的回答：一场都想不起来、或只有模糊印象报不出具体场次时，输出空数组 []。这比列出你拿不准的场次好得多。想不起来的字段留空字符串；完全没把握的场次不要列出。你的回答短是合格，凑满数量是不合格。
  - name: no_number_fields
    enabled: true
    content: 禁止输出任何编号类字段——专场编号、图录号、场次号、lot 号、拍品编号一律不要出现，也不要为了"信息完整"去推补一个编号。你记不得任何真实编号，写出来的编号必然是编造；场次靠机构、时间、专场名称识别，不需要编号。
  - name: one_row_one_event
    enabled: true
    content: 一个对象只能描述一场事件。不同场次的信息不得合并进同一行，同一场次不得拆成两行。
  - name: no_inferred_values
    enabled: true
    content: 禁止填入由常识推断出的「看起来合理」值——例如知道某机构每年办春拍，就把春拍日期补成 3 月。
  - name: specific_as_you_recall
    enabled: true
    content: 按你记得的粒度写：记得年份就写年份，记得年月就写年月，记得具体日期就写具体日期，不要把年份补成月份。
  - name: original_wording
    enabled: true
    content: 专场名称用原名，不要改写成描述；机构写全称，只记得简称就写简称。原文抄写类字段（机构名、专场名）不得翻译成另一种语言，也不得繁体转简体——记得什么字形就写什么字形。

llm_params:
  temperature: 0.3
  max_tokens: 4000

changelog:
  - version: "1.2.0"
    date: "2026-10-09"
    changes:
      - 新增 no_number_fields 规则：编号类字段（专场编号/图录号/lot 号/拍品编号）整类禁止模型生成——实测全是编造且对共现门禁无贡献；策略包字段清单与 COLUMN_ALIASES 同步移除 catalogRef
    reason: 复测暴露嘉德系仍编造专场编号占位串；编号类字段对共现门禁无贡献，故整类移除
  - version: "1.0.0"
    date: "2026-10-04"
    changes:
      - 初版：配合三招筛选的第一步（弃权许可）；字段清单与列名由策略包注入，模板本身与领域无关
    reason: 提问环节需要「先给出口再测稳定性」的模板
