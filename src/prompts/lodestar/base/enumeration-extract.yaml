name: lodestar_enumeration_extract
version: "1.0.1"
last_updated: "2026-10-11"
updated_by: "Trae (GLM)"

description: |
  检索增强提取（兜底链路的提取式复问）：记忆枚举（enumeration-answer）
  连续整轮弃权后，用一次联网搜索拿回资料文本，再让模型从资料里提取候选记录。
  防幻觉纪律在这里换了一个锚点——从"忠实于记忆"换成"忠实于资料"：
  资料里写明的才能列，资料里没有的一行都不许冒出来。

template: |
  # 角色
  你是 {{pack_label}} 领域的资料提取器：只从下面给出的搜索资料里提取具体事件，一场事件一行。

  # 提问
  {{question}}

  # 搜索资料
  {{context}}

  # 输出要求
  {{rules}}

  # 输出格式
  仅输出 JSON 数组，一场事件一个对象，对象键固定为：{{column_keys}}。
  资料里没写清的字段填空字符串 ""；资料里找不到任何相关事件时，输出空数组：
  []

  示例形态（值只为说明结构，不要照抄用词）：
  [
    { "拍卖机构": "中国嘉德", "举办时间": "2014年5月", "专场名称": "瓷器工艺品专场", "举办地点": "北京" }
  ]

rules:
  - name: extract_only_from_material
    enabled: true
    content: 只能提取搜索资料里明确写出的信息：专场名称、机构、时间必须在资料原文中有出处，资料里没有的场次一行都不要列，缺的字段留空字符串。禁止用你的记忆、常识或推断补任何值——例如资料只说了年份，就不要把月份补出来。
  - name: no_unconfirmed_values
    enabled: true
    content: 资料里明确写着"未确认""未公布""待定""以官方公告为准"或仅暗示、需要另行查阅公告或图录才能确认的信息，一律不得当作字段值抄出来——这类字段宁可留空字符串，整行都立不住的场次宁可整行不列。
  - name: one_row_one_event
    enabled: true
    content: 一个对象只能描述一场事件。不同场次的信息不得合并进同一行，同一场次不得拆成两行。
  - name: no_number_fields
    enabled: true
    content: 禁止输出任何编号类字段——专场编号、图录号、场次号、lot 号、拍品编号一律不要出现。场次靠机构、时间、专场名称识别，不需要编号。
  - name: original_wording
    enabled: true
    content: 机构与专场名称按资料原文抄写，不要改写成描述；资料里同一事件被多篇材料重复提到时只列一行。原文抄写类字段（机构名、专场名）不得翻译成另一种语言，也不得繁体转简体——资料用什么字形就抄什么字形。

llm_params:
  temperature: 0.2
  max_tokens: 4000

changelog:
  - version: "1.0.1"
    date: "2026-10-11"
    changes:
      - 新增 no_unconfirmed_values 纪律：资料里"未确认/待定/以官方公告为准"或仅暗示的信息不得当作字段值，宁留空或弃行
    reason: 预算优化实测发现提取行会从兜底搜索资料里把"待公布"类含糊表述抄成确定值，污染下游共现门禁的输入
  - version: "1.0.0"
    date: "2026-10-11"
    changes:
      - 初版：检索增强兜底的提取式复问模板——记忆枚举整轮弃权后，先联网搜索拿资料，再从资料提取候选；防幻觉纪律从"忠实于记忆"转为"忠实于资料"
    reason: 瓷器垂域实测两款模型凭记忆枚举全部整轮弃权，同问句改为先搜后答能出 9 行——唯一缺的变量是检索
