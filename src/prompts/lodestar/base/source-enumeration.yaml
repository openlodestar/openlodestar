name: lodestar_source_enumeration
version: "1.2.0"
last_updated: "2026-10-25"
updated_by: "Qoder"

description: |
  来源坐标的入口供给提问：先让模型凭记忆自由回答用户的问题，再把回答依据整理成
  "这件东西能在哪些页面采到"的来源清单。

  与枚举式提问（列举一场场具体事件）不是同一种产出：这里要的是**一个可再打开的页面**，
  机构名与器物主题是它的身份，网址是它的再入凭证。模型对旧站内页的网址记忆普遍不可靠，
  所以模板明确允许"只记得机构、不记得网址"——留空由下游检索，编一个网址才是不合格。
  本模板只负责"问出候选"，判它能不能用是入口门禁的事。

  2026-10-25 改版：此前的角色设定是"入口供给器、只报告页面入口"，模型在记不清具体网址时
  容易整轮弃权（三次实测均输出 []）。改法是降低"必须给入口"的压力：先回答用户问题，
  再列出依据；只记得机构也行，入口性交给门禁判。

template: |
  # 角色
  你是 {{pack_label}} 领域的行家。请凭你的记忆直接回答下面的问题，想到多少说多少；
  回答之后，把你依据的来源逐条列出来——拍卖行、古玩商、收藏或交易平台都可以。
  记得具体页面就写页面，只记得机构就写机构名，不必因为网址记不清而放弃整条线索。

  # 问题
  {{question}}

  # 输出要求
  {{rules}}

  # 输出格式
  只输出 JSON 数组：每个来源一行，对象键固定为：{{column_keys}}、「网址」。
  「网址」写完整 URL（含 https://）；只记得机构/平台、不记得网址时写空字符串 ""，
  下游会自己检索——**编一个看起来合理的网址是不合格**。
  一个来源只想不起任何字段时，把整行删掉，不要保留空壳。

  示例形态（值只为说明结构，不要照抄用词）：
  [
    { "机构/平台": "某拍卖行", "器物主题": "黄花梨躺椅", "年代": "清代", "材质": "黄花梨", "品类": "古典家具", "网址": "https://example.test/auction/list" }
  ]

  一个来源都想不起来时，输出空数组：
  []

rules:
  - name: recall_first
    enabled: true
    content: 先尽力回想，再判断真伪。只记得机构、记不得具体页面是常见且合格的回答，照实写机构名就行；确实一条来源都想不起来时，才输出空数组 []。不要为了凑数编造网址——那会让下游白抓一轮、污染坐标。
  - name: url_must_be_recalled
    enabled: true
    content: 「网址」只写你确实记得的完整地址（含 https://）。记不得就留空字符串 ""，下游会用机构名与器物主题去检索。不要用"看起来合理"的路径拼一个 URL，也不要写搜索引擎结果页或转载页的地址。
  - name: sources_only
    enabled: true
    content: 这里只收来源依据：价格结论、行情判断不必写进输出，也不要写进「器物主题」。只要来源本身。
  - name: entry_preferred
    enabled: true
    content: 来源优先给能继续点到具体器物的页面（专场归档、品类列表、站内检索、商品详情）；新闻、百科、论坛如果确实提到了它，也可以列，但把最像入口的放前面。
  - name: topic_is_the_object
    enabled: true
    content: 「器物主题」只写器物本身（如"黄花梨躺椅"、"青花瓷瓶"），不要把年代、材质、机构名或价格重复写进主题；它们各有自己的字段。
  - name: one_row_one_source
    enabled: true
    content: 一个对象只描述一个来源。同一机构下不同品类/不同主题的来源分开列，不要把多个网址塞进一行。
  - name: original_wording
    enabled: true
    content: 机构名、器物名用原名，不要翻译、不要繁体转简体；记得什么写法就写什么写法。

llm_params:
  model: qwen-max
  temperature: 0.3
  max_tokens: 3000

changelog:
  - version: "1.2.0"
    date: "2026-10-25"
    changes:
      - 角色从"入口供给器"改为"领域行家先回答问题、再列来源依据"；弃权从"首选合格回答"改为"最后手段"；新增"只要来源、不写价格结论"与"入口优先但新闻/百科也可列"两条规则；复问措辞去掉"入口页"压力
    reason: 旧模板要求直接给入口页，模型三次（含 qwen-max）都整轮弃权；降低作答压力，先让模型自由回忆
  - version: "1.1.0"
    date: "2026-10-25"
    changes:
      - 来源提问单点改用 qwen-max（其余文本节点仍用角色默认 qwen3.7-flash）；参数经 `InvokeParams.model` 显式覆盖，缓存键含模型名
    reason: 黄花梨躺椅提问在 qwen3.7-flash 下两轮整轮弃权，改用更强的模型记忆试一次
  - version: "1.0.0"
    date: "2026-10-24"
    changes:
      - 初版：来源坐标（器物/品类入口）的入口供给提问；显式允许"只记得机构、不记得网址"，禁止拼看起来合理的 URL
    reason: 用户要求 Lodestar 不局限于"某场拍卖会"，也要能为 RAG 检索某件器物给出可采集的网页入口
