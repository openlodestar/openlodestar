name: query_translation
version: "1.0.0"
last_updated: "2026-10-17"
updated_by: "AI Assistant"

description: |
  双语查询对（把一条轨的搜索查询整条翻译到另一种语言）。
  一次调用翻一批，逐位对应；只翻查询面本身，不扩写、不补充解释。
  为什么要翻：改搜索地区参数只影响排名偏好，查询词本身不换语言就永远
  覆盖不到另一种语言的语料面（实测生效率 0/22）。
  `site:域名` 前缀与其后的域名必须逐字保留——它是白名单门禁
  与域级定向的前提，翻掉就等于把定向查询变成普通词查询。

llm_params:
  temperature: 0.1

template: |
  # 角色
  你是搜索查询的翻译器。把下面这批查询逐条翻译成 {{target_language}}，
  译文要是"能直接丢给搜索引擎的查询"，不是解释、不是扩写。

  # 输入（JSON 数组，逐位对应）
  {{queries_json}}

  # 翻译要求
  1. 输出一个 JSON 数组，元素个数与输入**完全一致且逐位对应**，每个元素是一条译文。
  2. `site:域名` 前缀与其后的域名**逐字保留**（不翻译、不改写、不加空格、不删减），
     只翻译前缀之后的关键词部分。
  3. 不要扩写、不要补充解释、不要合并或拆分任何一条查询，也不要新增或删除元素。
  4. 专业词用该领域（拍卖 / 古董 / 收藏）的通用说法，例如：
     成交价 → sold price，专场 → special sale，瓷器 → porcelain，青花 → blue and white。
  5. 只返回合法 JSON 数组，不要 markdown 代码块，不要输出数组之外的任何文字。

changelog:
  - version: "1.0.0"
    date: "2026-10-17"
    changes:
      - 初稿：一批查询进、等长译文出；site: 前缀与域名逐字保留
    reason: 中英文双语支持（双轨检索）施工
